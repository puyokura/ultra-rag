name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest\n    env:\n      ULTRA_RAG_KEY_PROTECTOR: file-dev\n      ULTRA_RAG_ALLOW_INSECURE_KEYSTORE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: pip install -e .
      - run: python -m unittest discover -s tests -t .
